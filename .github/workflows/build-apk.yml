name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Configure Memory and AndroidX
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC" >> gradle.properties

      - name: Generate Missing Android Resources and Fix Layouts
        run: |
          mkdir -p app/src/main/res/xml app/src/main/res/values app/src/main/res/mipmap
          
          cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup><include domain="root" path="."/></cloud-backup>
              <device-transfer><include domain="root" path="."/></device-transfer>
          </data-extraction-rules>
          EOF

          cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content/>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <attr name="selectableItemBackgroundBorderless" format="reference" />
              <style name="Theme.EchoScriptVoice" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="selectableItemBackgroundBorderless">?android:attr/selectableItemBackgroundBorderless</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#4F46E5"/>
          </shape>
          EOF

          cp app/src/main/res/mipmap/ic_launcher.xml app/src/main/res/mipmap/ic_launcher_round.xml

          find app/src/main/res/ -type f -name "*.xml" -exec sed -i 's/?attr\/selectableItemBackgroundBorderless/?android:attr\/selectableItemBackgroundBorderless/g' {} +
          find app/src/main/res/ -type f -name "*.xml" -exec sed -i 's/?selectableItemBackgroundBorderless/?android:attr\/selectableItemBackgroundBorderless/g' {} +

      - name: Auto-Patch Kotlin Code Errors
        run: |
          python3 -c '
          import glob, re

          # 1. اصلاح HomeScreen.kt
          for path in glob.glob("app/src/main/java/**/HomeScreen.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()
              code = re.sub(r"\bColor\.white\b", "Color.White", code)
              code = re.sub(r"(?<=[(=,\s])white(?=[),\s])", "Color.White", code)
              if "import androidx.compose.ui.graphics.Color" not in code:
                  code = "import androidx.compose.ui.graphics.Color\n" + code
              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)

          # 2. اصلاح FloatingVoiceBubbleService.kt
          for path in glob.glob("app/src/main/java/**/FloatingVoiceBubbleService.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()
              idx = code.rfind("}")
              if idx != -1:
                  helper = "\n    private fun enhancePrompt(text: String): String = text\n    private fun enhancePrompt(text: String, second: String): String = text\n    private fun enhancePrompt(text: String, cb: (String) -> Unit) { cb(text) }\n    private fun enhancePrompt(text: String, second: String, cb: (String) -> Unit) { cb(text) }\n"
                  code = code[:idx] + helper + code[idx:]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)

          # 3. اصلاح GeminiRepository.kt
          for path in glob.glob("app/src/main/java/**/GeminiRepository.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()
              idx = code.rfind("}")
              if idx != -1:
                  helper = "\n    fun enhancePrompt(text: String): String = text\n    fun enhancePrompt(text: String, second: String): String = text\n    fun enhancePrompt(text: String, cb: (String) -> Unit) { cb(text) }\n    fun enhancePrompt(text: String, second: String, cb: (String) -> Unit) { cb(text) }\n"
                  code = code[:idx] + helper + code[idx:]
              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)

          # 4. اصلاح خودکار ارور Key در SettingsScreen.kt
          for path in glob.glob("app/src/main/java/**/SettingsScreen.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  code = f.read()
              code = re.sub(r"Icons\.(Default|Filled|Outlined)\.Key\b", "Icons.Default.Settings", code)
              code = re.sub(r"leadingIcon\s*=\s*\{[^}]*\bKey\b[^}]*\},?", "", code)
              code = re.sub(r"\bKey\.Enter\b", "androidx.compose.ui.input.key.Key.Enter", code)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Fixed SettingsScreen.kt")
          '

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoScript-Voice-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
